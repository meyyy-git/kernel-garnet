name: Build kernel garnet

# Kernel GKI android12-5.10 untuk garnet: Google ACK murni + KernelSU-Next built-in.
# Hasilnya hanya `Image` (pengganti kernel di partisi boot). Tidak ada patch pihak ketiga.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Cabang ACK (android12-5.10 = rilis, android12-5.10-lts = lebih baru)
        default: android12-5.10
      ksu_ref:
        description: Tag/commit KernelSU-Next (kosong = tag rilis terbaru)
        default: ''
      force:
        description: Build ulang walau rilis dengan versi yang sama sudah ada
        type: boolean
        default: false
  schedule:
    # Senin 03:00 UTC. GitHub mematikan jadwal ini setelah 60 hari repo tanpa aktivitas.
    - cron: '0 3 * * 1'

permissions:
  contents: write

env:
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'android12-5.10' }}
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  # Toolchain resmi cabang ini (lihat CLANG_PREBUILT_BIN di build.config.common ACK).
  CLANG: clang-r416183b
  MAKE_ARGS: ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out

jobs:
  build:
    # 22.04 sengaja: clang prebuilt Android 12 butuh pustaka lama yang tidak ada di 24.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Tentukan versi dari upstream
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -euo pipefail
          ack_sha=$(git ls-remote https://android.googlesource.com/kernel/common "refs/heads/$KERNEL_BRANCH" | cut -c1-12)
          [ -n "$ack_sha" ] || { echo "Cabang ACK $KERNEL_BRANCH tidak ditemukan"; exit 1; }
          if [ -z "$KSU_REF" ]; then
            KSU_REF=$(git ls-remote --tags --refs --sort=-v:refname "$KSU_REPO" 'v*' \
              | grep -v legacy | sed 's@.*refs/tags/@@' | awk 'NR==1')  # awk, bukan head: head memutus pipa dan pipefail menggagalkan langkah
          fi
          [ -n "$KSU_REF" ] || { echo "Tag KernelSU-Next tidak ditemukan"; exit 1; }
          tag="$KERNEL_BRANCH-$ack_sha-ksu-$KSU_REF"
          echo "ack_sha=$ack_sha" >> "$GITHUB_OUTPUT"
          echo "ksu_ref=$KSU_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tidak ada yang baru: rilis $tag sudah ada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pasang dependensi
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex make libssl-dev libelf-dev python3 cpio \
            binutils-aarch64-linux-gnu

      - name: Cache clang
        if: steps.ver.outputs.skip != 'true'
        id: clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ env.CLANG }}

      - name: Unduh clang
        if: steps.ver.outputs.skip != 'true' && steps.clang.outputs.cache-hit != 'true'
        run: |
          mkdir clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/$CLANG.tar.gz" \
            | tar -xz -C clang

      - name: Ambil source kernel (Google ACK)
        if: steps.ver.outputs.skip != 'true'
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" https://android.googlesource.com/kernel/common kernel

      - name: Tambahkan KernelSU-Next
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd kernel
          # Clone penuh: Kbuild KernelSU menghitung nomor versi dari jumlah commit.
          git clone "$KSU_REPO" KernelSU-Next
          git -C KernelSU-Next checkout "${{ steps.ver.outputs.ksu_ref }}"
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Konfigurasi
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          # ThinLTO: Full LTO tidak muat di RAM runner. CFI dan SCS tetap aktif dari gki_defconfig.
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' arch/arm64/configs/gki_defconfig
          echo 'CONFIG_KSU=y' >> arch/arm64/configs/gki_defconfig
          # Nama rilis kernel mengikuti pola GKI; tanpa ini muncul akhiran "-dirty".
          echo '-android12-9-garnet' > .scmversion
          make $MAKE_ARGS gki_defconfig
          # Tanpa salah satu opsi ini, modul vendor stok ditolak atau kernel panic saat boot.
          for opt in KSU CFI_CLANG SHADOW_CALL_STACK LTO_CLANG_THIN MODVERSIONS KPROBES; do
            grep -q "^CONFIG_$opt=y" out/.config || { echo "CONFIG_$opt tidak aktif"; exit 1; }
          done

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        id: build
        run: |
          set -euo pipefail
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          make -j"$(nproc)" $MAKE_ARGS Image
          release=$(make -s $MAKE_ARGS kernelrelease)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          cd out/arch/arm64/boot
          sha256sum Image > Image.sha256
          cat Image.sha256

      - name: Rilis
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd kernel/out/arch/arm64/boot
          tag="${{ steps.ver.outputs.tag }}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --title "${{ steps.build.outputs.release }}" \
            --notes "Kernel \`${{ steps.build.outputs.release }}\`
          ACK \`$KERNEL_BRANCH\` @ \`${{ steps.ver.outputs.ack_sha }}\`
          KernelSU-Next \`${{ steps.ver.outputs.ksu_ref }}\` (built-in)

          Uji dulu dengan \`fastboot boot\` sebelum flash permanen."
          # --clobber: build ulang paksa menimpa file rilis yang sama.
          gh release upload "$tag" Image Image.sha256 -R "$GITHUB_REPOSITORY" --clobber
