name: Build Equinox Kernel

# Kernel GKI android12-5.10 untuk garnet:
#   Google ACK + SukiSU Ultra (cabang builtin) + SUSFS + KPM.
# Hasil: `Image` (pengganti kernel di partisi boot) dan modul SUSFS untuk manager.
# Satu-satunya tambalan ke source kernel adalah patch SUSFS resmi; ia hanya menyentuh
# file .c, bukan header, jadi antarmuka modul vendor (KMI) tidak berubah.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Cabang ACK (android12-5.10 = rilis, android12-5.10-lts = lebih baru)
        default: android12-5.10
      ksu_ref:
        description: Cabang/commit SukiSU Ultra (harus turunan cabang builtin)
        default: builtin
      susfs_ref:
        description: Cabang/commit susfs4ksu
        default: gki-android12-5.10
      experiments:
        description: Percobaan dari folder experiments/, dipisah spasi (mis. "adios33 hz300"). Kosong = build resmi
        default: ''
      force:
        description: Build ulang walau rilis dengan versi yang sama sudah ada
        type: boolean
        default: false
  schedule:
    # Senin 03:00 UTC. GitHub mematikan jadwal ini setelah 60 hari repo tanpa aktivitas.
    - cron: '0 3 * * 1'

permissions:
  contents: write

env:
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'android12-5.10' }}
  KSU_REF: ${{ inputs.ksu_ref || 'builtin' }}
  SUSFS_REF: ${{ inputs.susfs_ref || 'gki-android12-5.10' }}
  # Percobaan tidak pernah masuk build resmi/terjadwal; hanya lewat input manual.
  EXPERIMENTS: ${{ inputs.experiments }}
  ACK_REPO: https://android.googlesource.com/kernel/common
  KSU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu
  # Toolchain resmi cabang ini (CLANG_PREBUILT_BIN di build.config.common ACK). Jangan diganti:
  # kernel hasil clang-r536225 (clang 19) mati dalam beberapa detik di garnet, dengan atau
  # tanpa patch performa (diuji 12 Nov 2026 lewat fastboot boot).
  CLANG: clang-r416183b
  MAKE_ARGS: ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out

jobs:
  build:
    # 22.04 sengaja: clang prebuilt Android 12 butuh pustaka lama yang tidak ada di 24.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Tentukan versi dari upstream
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Commit terkini sebuah cabang; kalau bukan nama cabang, pakai nilainya apa adanya.
          head_of() {
            sha=$(git ls-remote "$1" "refs/heads/$2" | cut -c1-10)
            echo "${sha:-$2}"
          }
          ack=$(head_of "$ACK_REPO" "$KERNEL_BRANCH")
          ksu=$(head_of "$KSU_REPO" "$KSU_REF")
          susfs=$(head_of "$SUSFS_REPO" "$SUSFS_REF")
          # GITHUB_SHA ikut: perubahan workflow/konfigurasi juga harus memicu build baru.
          tag="$KERNEL_BRANCH-$ack-sukisu-$ksu-susfs-$susfs-${CLANG#clang-}-${GITHUB_SHA::7}"
          # Akhiran percobaan, mis. "-exp-adios33-hz300"; kosong untuk build resmi.
          exp=""
          for e in $EXPERIMENTS; do exp="$exp-$e"; done
          if [ -n "$exp" ]; then exp="-exp$exp"; fi
          tag="$tag$exp"
          echo "exp=$exp" >> "$GITHUB_OUTPUT"
          {
            echo "ack=$ack"
            echo "ksu=$ksu"
            echo "susfs=$susfs"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tidak ada yang baru: rilis $tag sudah ada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pasang dependensi
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex make libssl-dev libelf-dev python3 cpio zip \
            binutils-aarch64-linux-gnu

      - name: Cache clang
        if: steps.ver.outputs.skip != 'true'
        id: clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ env.CLANG }}

      - name: Unduh clang
        if: steps.ver.outputs.skip != 'true' && steps.clang.outputs.cache-hit != 'true'
        run: |
          # r416183b tidak ada lagi di cabang main AOSP, jadi diambil dari tag Android 12.
          mkdir clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/$CLANG.tar.gz" \
            | tar -xz -C clang

      - name: Checkout repo ini
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Ambil source kernel (Google ACK)
        if: steps.ver.outputs.skip != 'true'
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$ACK_REPO" kernel

      - name: Tambahkan SukiSU Ultra
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd kernel
          # Clone penuh: build SukiSU menghitung nomor versi dari jumlah commit.
          git clone "$KSU_REPO" KernelSU
          git -C KernelSU checkout "${{ steps.ver.outputs.ksu }}"
          # shortcut: salah ketik upstream sejak commit c70c717 (11 Nov 2026) membuat kompilasi gagal;
          # sed ini tidak berefek setelah SukiSU memperbaikinya, hapus saat itu.
          sed -i 's/^\(\s*\)policydb->latest_granting = old_pol->latest_granting + 1;/\1pol->latest_granting = old_pol->latest_granting + 1;/' \
            KernelSU/kernel/selinux/rules.c
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Tambahkan SUSFS
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git clone "$SUSFS_REPO" susfs4ksu
          git -C susfs4ksu checkout "${{ steps.ver.outputs.susfs }}"
          cd kernel
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          # Kalau ACK berubah sampai patch tidak cocok, patch gagal dan build berhenti di sini
          # alih-alih menghasilkan kernel yang ditambal setengah.
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          # Modul SUSFS untuk dipasang lewat manager, dari commit yang sama dengan patch kernel.
          (cd ../susfs4ksu/ksu_module_susfs && zip -qr "$GITHUB_WORKSPACE/ksu_module_susfs.zip" .)

      - name: Terapkan patch
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd kernel
          # Asal-usul tiap patch ada di patches/SOURCE.txt.
          for p in ../repo/patches/*.patch; do
            echo "== $p"
            patch -p1 < "$p"
          done
          # Kalau pemeriksaan ini masih ada, layar HyperOS berkedip (lihat patches/SOURCE.txt).
          ! grep -q 'valid clone check' drivers/gpu/drm/drm_atomic_helper.c
          # ADIOS asli crash di 5.10 (NULL data->hctx di limit_depth); pastikan versi yang diperbaiki.
          ! grep -q 'to_word_depth' block/adios.c
          for e in $EXPERIMENTS; do
            [ -f "../repo/experiments/$e.patch" ] || [ -f "../repo/experiments/$e.config" ] \
              || { echo "Percobaan tidak dikenal: $e"; exit 1; }
            if [ -f "../repo/experiments/$e.patch" ]; then
              echo "== percobaan $e"
              patch -p1 < "../repo/experiments/$e.patch"
            fi
          done

      - name: Konfigurasi
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          # ThinLTO: Full LTO tidak muat di RAM runner. CFI dan SCS tetap aktif dari gki_defconfig.
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' arch/arm64/configs/gki_defconfig
          # Semua fitur SUSFS aktif secara default begitu CONFIG_KSU_SUSFS=y.
          printf 'CONFIG_KSU=y\nCONFIG_KPM=y\nCONFIG_KSU_SUSFS=y\n' >> arch/arm64/configs/gki_defconfig
          # TCP BBR sebagai default: satu-satunya opsi performa umum yang belum ada di gki_defconfig.
          printf 'CONFIG_TCP_CONG_ADVANCED=y\nCONFIG_TCP_CONG_BBR=y\nCONFIG_DEFAULT_BBR=y\n' >> arch/arm64/configs/gki_defconfig
          # ADIOS tersedia sebagai pilihan; ROM tetap memasang bfq saat boot.
          printf 'CONFIG_MQ_IOSCHED_ADIOS=y\n' >> arch/arm64/configs/gki_defconfig
          # Nama kernel di uname: 5.10.x-android12-9-Equinox-r<nomor build>. Bagian "android12-9"
          # dipertahankan karena manager root membaca KMI dari sana. Yang perlu lolos deteksi
          # bisa menyamarkannya lewat fitur spoof uname SUSFS.
          echo "-android12-9-Equinox-r$GITHUB_RUN_NUMBER" > .scmversion
          for e in $EXPERIMENTS; do
            if [ -f "../repo/experiments/$e.config" ]; then cat "../repo/experiments/$e.config" >> arch/arm64/configs/gki_defconfig; fi
          done
          make $MAKE_ARGS gki_defconfig
          # Opsi percobaan yang diam-diam tidak terpasang membuat hasil uji menyesatkan.
          for e in $EXPERIMENTS; do
            [ -f "../repo/experiments/$e.config" ] || continue
            while read -r line; do
              grep -qxF "$line" out/.config || { echo "Percobaan $e: $line tidak aktif"; exit 1; }
            done < "../repo/experiments/$e.config"
          done
          # Tanpa salah satu opsi ini, modul vendor stok ditolak atau kernel panic saat boot.
          for opt in KSU KPM KSU_SUSFS MQ_IOSCHED_ADIOS CFI_CLANG SHADOW_CALL_STACK LTO_CLANG_THIN MODVERSIONS; do
            grep -q "^CONFIG_$opt=y" out/.config || { echo "CONFIG_$opt tidak aktif"; exit 1; }
          done
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config || { echo "BBR bukan default"; exit 1; }
          grep '^CONFIG_KSU' out/.config

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        id: build
        run: |
          set -euo pipefail
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          make -j"$(nproc)" $MAKE_ARGS Image
          release=$(make -s $MAKE_ARGS kernelrelease)
          kver=$(make -s $MAKE_ARGS kernelversion)
          susfs_version=$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h)
          # Nama build: Equinox-garnet-<versi kernel>-r<nomor build>.
          name="Equinox-garnet-$kver-r$GITHUB_RUN_NUMBER${{ steps.ver.outputs.exp }}"
          {
            echo "release=$release"
            echo "susfs_version=$susfs_version"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          cd "$GITHUB_WORKSPACE"
          # Installer AnyKernel3: flash lewat manager root atau recovery.
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp repo/anykernel/anykernel.sh repo/anykernel/banner ak3/
          # File `version` ditampilkan AnyKernel3 di bawah banner saat instalasi.
          {
            echo "  Build    : $name"
            echo "  Date     : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "  Kernel   : $release"
            echo "  Root     : SukiSU Ultra ${{ steps.ver.outputs.ksu }} + KPM"
            echo "  Hiding   : SUSFS $susfs_version"
            echo "  Compiler : $CLANG"
            if [ -n "$EXPERIMENTS" ]; then echo "  EXPERIMENTAL BUILD: $EXPERIMENTS"; fi
          } > ak3/version
          cat ak3/banner ak3/version
          cp Image ak3/Image
          (cd ak3 && zip -qr9 "../$name-AnyKernel3.zip" . -x '*placeholder')
          sha256sum Image Equinox-*-AnyKernel3.zip ksu_module_susfs.zip | tee SHA256SUMS

      - name: Rilis
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          name="${{ steps.build.outputs.name }}"
          # Catatan rilis untuk publik, berbahasa Inggris.
          cat > notes.md <<EOF
          ## Equinox Kernel for Redmi Note 13 Pro 5G / POCO X6 5G (garnet)

          **Kernel** \`${{ steps.build.outputs.release }}\` (GKI \`$KERNEL_BRANCH\`)

          ### What's inside
          - **Root:** SukiSU Ultra, built in, with KPM
          - **Root hiding:** SUSFS ${{ steps.build.outputs.susfs_version }}
          - **Network:** TCP BBR as the default congestion control
          - **Display:** HyperOS flicker fix (reverts "drm: Add valid clones check")
          - **Storage:** ADIOS I/O scheduler v3.3.0, fixed for 5.10. Optional: HyperOS keeps \`bfq\` until you switch (see the README)
          - **Toolchain:** official AOSP \`$CLANG\`, with CFI, SCS and ThinLTO enabled

          ### Install
          1. Back up your current \`boot\` partition.
          2. Flash \`$name-AnyKernel3.zip\` from a custom recovery, then reboot.
          3. Install the SukiSU Ultra manager.
          4. Optional: flash \`ksu_module_susfs.zip\` from the manager to configure SUSFS.

          Only the kernel inside \`boot\` is replaced. \`vendor_boot\`, \`dtbo\` and your data are not touched.
          To go back, flash your \`boot\` backup.

          ### Before you flash
          - A release titled **[UNTESTED]** has been compiled but not yet booted on a device.
          - Tested ROM: HyperOS 3.0.315.0 CN (Android 16). Other HyperOS versions on garnet share the same kernel interface (\`android12-5.10\`, KMI 9) and should work, but are untested. Please report your results.
          - You flash at your own risk. Keep a \`boot\` backup and a PC with fastboot at hand.

          ### Sources
          - Android Common Kernel \`$KERNEL_BRANCH\` @ \`${{ steps.ver.outputs.ack }}\`
          - SukiSU Ultra \`$KSU_REF\` @ \`${{ steps.ver.outputs.ksu }}\`
          - susfs4ksu \`$SUSFS_REF\` @ \`${{ steps.ver.outputs.susfs }}\`
          - Patches and build workflow: this repository @ \`${GITHUB_SHA::7}\`

          Checksums are in \`SHA256SUMS\`.
          EOF
          # Rilis baru selalu prerelease berlabel UNTESTED: build yang lolos kompilasi belum
          # tentu boot. Label dicabut manual setelah lolos uji fastboot boot di HP.
          label="[UNTESTED]"
          if [ -n "$EXPERIMENTS" ]; then
            label="[EXPERIMENT]"
            printf '> **Experimental build** with: `%s`. For testing only, not a release.\n\n' "$EXPERIMENTS" \
              | cat - notes.md > notes.tmp && mv notes.tmp notes.md
          fi
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "$label $name" --notes-file notes.md
          fi
          # --clobber: build ulang paksa menimpa file rilis yang sama.
          gh release upload "$tag" Image Equinox-*-AnyKernel3.zip ksu_module_susfs.zip SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
