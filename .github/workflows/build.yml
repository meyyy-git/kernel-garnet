name: Build kernel garnet

# Kernel GKI android12-5.10 untuk garnet:
#   Google ACK + SukiSU Ultra (cabang builtin) + SUSFS + KPM.
# Hasil: `Image` (pengganti kernel di partisi boot) dan modul SUSFS untuk manager.
# Satu-satunya tambalan ke source kernel adalah patch SUSFS resmi; ia hanya menyentuh
# file .c, bukan header, jadi antarmuka modul vendor (KMI) tidak berubah.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Cabang ACK (android12-5.10 = rilis, android12-5.10-lts = lebih baru)
        default: android12-5.10
      ksu_ref:
        description: Cabang/commit SukiSU Ultra (harus turunan cabang builtin)
        default: builtin
      susfs_ref:
        description: Cabang/commit susfs4ksu
        default: gki-android12-5.10
      clang:
        description: Toolchain (clang-r416183b = resmi Android 12, pakai ini kalau kernel gagal boot)
        type: choice
        options: [clang-r536225, clang-r416183b]
        default: clang-r536225
      force:
        description: Build ulang walau rilis dengan versi yang sama sudah ada
        type: boolean
        default: false
  schedule:
    # Senin 03:00 UTC. GitHub mematikan jadwal ini setelah 60 hari repo tanpa aktivitas.
    - cron: '0 3 * * 1'

permissions:
  contents: write

env:
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'android12-5.10' }}
  KSU_REF: ${{ inputs.ksu_ref || 'builtin' }}
  SUSFS_REF: ${{ inputs.susfs_ref || 'gki-android12-5.10' }}
  ACK_REPO: https://android.googlesource.com/kernel/common
  KSU_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu
  # r536225 (clang 19) menghasilkan kode lebih optimal; toolchain resmi cabang ini
  # adalah r416183b (clang 12, lihat CLANG_PREBUILT_BIN di build.config.common ACK).
  CLANG: ${{ inputs.clang || 'clang-r536225' }}
  MAKE_ARGS: ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out

jobs:
  build:
    # 22.04 sengaja: clang prebuilt Android 12 butuh pustaka lama yang tidak ada di 24.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Tentukan versi dari upstream
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Commit terkini sebuah cabang; kalau bukan nama cabang, pakai nilainya apa adanya.
          head_of() {
            sha=$(git ls-remote "$1" "refs/heads/$2" | cut -c1-10)
            echo "${sha:-$2}"
          }
          ack=$(head_of "$ACK_REPO" "$KERNEL_BRANCH")
          ksu=$(head_of "$KSU_REPO" "$KSU_REF")
          susfs=$(head_of "$SUSFS_REPO" "$SUSFS_REF")
          # GITHUB_SHA ikut: perubahan workflow/konfigurasi juga harus memicu build baru.
          tag="$KERNEL_BRANCH-$ack-sukisu-$ksu-susfs-$susfs-${CLANG#clang-}-${GITHUB_SHA::7}"
          {
            echo "ack=$ack"
            echo "ksu=$ksu"
            echo "susfs=$susfs"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tidak ada yang baru: rilis $tag sudah ada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pasang dependensi
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex make libssl-dev libelf-dev python3 cpio zip \
            binutils-aarch64-linux-gnu

      - name: Cache clang
        if: steps.ver.outputs.skip != 'true'
        id: clang
        uses: actions/cache@v4
        with:
          path: clang
          key: ${{ env.CLANG }}

      - name: Unduh clang
        if: steps.ver.outputs.skip != 'true' && steps.clang.outputs.cache-hit != 'true'
        run: |
          # r416183b tidak ada lagi di cabang main AOSP, jadi diambil dari tag Android 12.
          ref=refs/heads/main
          if [ "$CLANG" = clang-r416183b ]; then ref=refs/tags/android-12.0.0_r1; fi
          mkdir clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$ref/$CLANG.tar.gz" \
            | tar -xz -C clang

      - name: Checkout repo ini
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Ambil source kernel (Google ACK)
        if: steps.ver.outputs.skip != 'true'
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$ACK_REPO" kernel

      - name: Tambahkan SukiSU Ultra
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd kernel
          # Clone penuh: build SukiSU menghitung nomor versi dari jumlah commit.
          git clone "$KSU_REPO" KernelSU
          git -C KernelSU checkout "${{ steps.ver.outputs.ksu }}"
          # shortcut: salah ketik upstream sejak commit c70c717 (11 Nov 2026) membuat kompilasi gagal;
          # sed ini tidak berefek setelah SukiSU memperbaikinya, hapus saat itu.
          sed -i 's/^\(\s*\)policydb->latest_granting = old_pol->latest_granting + 1;/\1pol->latest_granting = old_pol->latest_granting + 1;/' \
            KernelSU/kernel/selinux/rules.c
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Tambahkan SUSFS
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git clone "$SUSFS_REPO" susfs4ksu
          git -C susfs4ksu checkout "${{ steps.ver.outputs.susfs }}"
          cd kernel
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          # Kalau ACK berubah sampai patch tidak cocok, patch gagal dan build berhenti di sini
          # alih-alih menghasilkan kernel yang ditambal setengah.
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          # Modul SUSFS untuk dipasang lewat manager, dari commit yang sama dengan patch kernel.
          (cd ../susfs4ksu/ksu_module_susfs && zip -qr "$GITHUB_WORKSPACE/ksu_module_susfs.zip" .)

      - name: Konfigurasi
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -euo pipefail
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          # ThinLTO: Full LTO tidak muat di RAM runner. CFI dan SCS tetap aktif dari gki_defconfig.
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' arch/arm64/configs/gki_defconfig
          # Semua fitur SUSFS aktif secara default begitu CONFIG_KSU_SUSFS=y.
          printf 'CONFIG_KSU=y\nCONFIG_KPM=y\nCONFIG_KSU_SUSFS=y\n' >> arch/arm64/configs/gki_defconfig
          # TCP BBR sebagai default: satu-satunya opsi performa umum yang belum ada di gki_defconfig.
          printf 'CONFIG_TCP_CONG_ADVANCED=y\nCONFIG_TCP_CONG_BBR=y\nCONFIG_DEFAULT_BBR=y\n' >> arch/arm64/configs/gki_defconfig
          # Nama rilis kernel mengikuti pola GKI; tanpa ini muncul akhiran "-dirty".
          echo '-android12-9-garnet' > .scmversion
          make $MAKE_ARGS gki_defconfig
          # Tanpa salah satu opsi ini, modul vendor stok ditolak atau kernel panic saat boot.
          for opt in KSU KPM KSU_SUSFS CFI_CLANG SHADOW_CALL_STACK LTO_CLANG_THIN MODVERSIONS; do
            grep -q "^CONFIG_$opt=y" out/.config || { echo "CONFIG_$opt tidak aktif"; exit 1; }
          done
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config || { echo "BBR bukan default"; exit 1; }
          grep '^CONFIG_KSU' out/.config

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        id: build
        run: |
          set -euo pipefail
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          make -j"$(nproc)" $MAKE_ARGS Image
          echo "release=$(make -s $MAKE_ARGS kernelrelease)" >> "$GITHUB_OUTPUT"
          echo "susfs_version=$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h)" >> "$GITHUB_OUTPUT"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image"
          release=$(make -s $MAKE_ARGS kernelrelease)
          cd "$GITHUB_WORKSPACE"
          # Installer AnyKernel3: flash lewat manager root atau recovery.
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp repo/anykernel/anykernel.sh ak3/anykernel.sh
          cp Image ak3/Image
          (cd ak3 && zip -qr9 "../kernel-garnet-$release-AnyKernel3.zip" . -x '*placeholder')
          sha256sum Image kernel-garnet-*-AnyKernel3.zip ksu_module_susfs.zip | tee SHA256SUMS

      - name: Rilis
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --title "${{ steps.build.outputs.release }}" \
            --notes "Kernel \`${{ steps.build.outputs.release }}\`
          ACK \`$KERNEL_BRANCH\` @ \`${{ steps.ver.outputs.ack }}\`
          SukiSU Ultra \`$KSU_REF\` @ \`${{ steps.ver.outputs.ksu }}\` (built-in, KPM aktif)
          SUSFS ${{ steps.build.outputs.susfs_version }} @ \`${{ steps.ver.outputs.susfs }}\`

          Toolchain \`$CLANG\`, TCP BBR default

          Uji dulu dengan \`fastboot boot\` sebelum flash permanen."
          # --clobber: build ulang paksa menimpa file rilis yang sama.
          gh release upload "$tag" Image kernel-garnet-*-AnyKernel3.zip ksu_module_susfs.zip SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
